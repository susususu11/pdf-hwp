name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: node tool/setup.mjs
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: easy-doc-viewer-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch test on emulator
        continue-on-error: true
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell am start -W -n app.easydoc.easy_doc_viewer/.MainActivity --ez selftest true || true
            sleep 90
            echo "=== PROCESS ===" ; adb shell pidof app.easydoc.easy_doc_viewer || echo "APP NOT RUNNING"
            echo "=== CRASH LOG ===" ; adb logcat -d -b crash || true
            echo "=== SELFTEST ===" ; adb logcat -d | grep -E "SELFTEST|WEBVIEW" || true
            echo "=== APP LOG ===" ; adb logcat -d -t 500 | grep -E "FATAL|AndroidRuntime|flutter|F DEBUG|Abort|easy_doc" || true
            adb exec-out screencap -p > emulator-screen.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screen
          path: emulator-screen.png
          if-no-files-found: ignore
